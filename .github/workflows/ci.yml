name: ci
on: [push, pull_request]
permissions:
  contents: read

# issue #14: without an explicit shell, GitHub runs steps with `bash -e`
# WITHOUT pipefail, so `make test 2>&1 | tee ...` reported tee's exit code
# (almost always 0) and red tests still greened the job — run #20 shipped
# UID1+SIG1 failures as "success". `shell: bash` on GH Actions adds
# `-o pipefail`, making the pipe return make's real exit code.
defaults:
  run:
    shell: bash

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ubuntu-24.04 runner images may restrict unprivileged user namespaces
      # via apparmor (kernel.apparmor_restrict_unprivileged_userns) — minict
      # is built on userns, so lift the restriction defensively before tests.
      - name: allow unprivileged userns
        run: |
          uname -r
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          unshare --user --map-root-user --mount echo "userns OK"

      - name: build
        run: make build
      - name: rootfs
        run: make rootfs
      # run-suites.sh runs isolation (17) + seccomp (20) + netns (7) even when
      # an earlier suite is red, and fails if any of them failed — CI evidence
      # is complete and the exit code is real (pipefail above).
      - name: test (isolation 17 + seccomp 20 + netns 7, all suites)
        run: make test 2>&1 | tee tests/evidence/ci-test-all.txt
      - name: test-web (6 cases)
        run: make test-web 2>&1 | tee tests/evidence/ci-test-web.txt
      - name: perf-check (cold start / RSS / disk vs thresholds)
        run: make perf-check

      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: tests/evidence/ci-*.txt
          if-no-files-found: ignore
