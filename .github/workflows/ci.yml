name: ci
on: [push, pull_request]
permissions:
  contents: read

# issue #14: without an explicit shell, GitHub runs steps with `bash -e`
# WITHOUT pipefail, so `make test 2>&1 | tee ...` reported tee's exit code
# (almost always 0) and red tests still greened the job — run #20 shipped
# UID1+SIG1 failures as "success". `shell: bash` on GH Actions adds
# `-o pipefail`, making the pipe return make's real exit code.
defaults:
  run:
    shell: bash

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ubuntu-24.04 runner images may restrict unprivileged user namespaces
      # via apparmor (kernel.apparmor_restrict_unprivileged_userns) — minict
      # is built on userns, so lift the restriction defensively before tests.
      - name: allow unprivileged userns
        run: |
          uname -r
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          unshare --user --map-root-user --mount echo "userns OK"

      - name: build
        run: make build
      - name: rootfs
        run: make rootfs
      # run-suites.sh runs isolation (17) + seccomp (20) + netns (7) even when
      # an earlier suite is red, and fails if any of them failed — CI evidence
      # is complete and the exit code is real (pipefail above).
      - name: test (isolation 21 + seccomp 20 + netns 7 + alpine 8, all suites)
        run: mkdir -p ci-evidence && make test 2>&1 | tee ci-evidence/test-all.txt
      - name: test-cve-gate (cve-daily issue gate, 7 cases)
        run: make test-cve-gate
      - name: test-cve-kernel (kernel CVE ranges + discovery, offline)
        run: make test-cve-kernel
      # README drift gate (issues #26, #27): fails the PR when README points at
      # missing files, repeats a fixed limitation, or its Platform Support
      # table disagrees with idea/manifest.md §5. Self-test has negative controls.
      - name: check-docs (README vs repo + manifest §5)
        run: make check-docs && make test-check-docs
      - name: test-web (6 cases)
        run: mkdir -p ci-evidence && make test-web 2>&1 | tee ci-evidence/test-web.txt
      - name: perf-check (cold start / RSS / disk vs thresholds)
        run: make perf-check

      # minictd control-plane (GĐ2 seed, D25–D27): real daemon -> patched
      # minict -> minict-exec (setns) e2e, 20 cases incl. seccomp parity
      # (MD0). Same pipefail rule: a red suite fails the job.
      # go.mod pins the language MINIMUM (1.23); the toolchain is the
      # current stable release so net/http & co. carry the latest stdlib
      # security fixes (1.23 itself is out of upstream support).
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: test-minictd (20 cases)
        run: mkdir -p ci-evidence && make test-minictd 2>&1 | tee ci-evidence/test-minictd.txt

      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: ci-evidence/*.txt
          if-no-files-found: ignore

  # GĐ3 mục 5: the web console (console/, Next.js static export served by
  # `minictd --ui-dir`) must keep type-checking and building, so a PR that
  # breaks it is blocked. Separate job: no userns/rootfs needed, runs in
  # parallel. `npm ci --ignore-scripts` = no dependency install scripts.
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: make console (npm ci + tsc --noEmit + next build -> console/out)
        run: make console

  # GĐ4 (owner 2026-11-27): standard GitHub runners expose /dev/kvm (probe
  # PR #225: ubuntu-24.04 + 22.04, uid 1001 KVM_CREATE_VM OK). This job is
  # the ONLY place KVM-gated tests must run for real — here they may not
  # SKIP. Rootless: the udev rule only opens /dev/kvm to the runner user
  # (manifest §5 one-time machine prerequisite); firecracker itself runs as
  # the normal user.
  kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: enable /dev/kvm for the runner user (manifest §5 prerequisite)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: KVM usable as normal user (fail if not — this job must not skip)
        run: |
          python3 - <<'PY'
          import fcntl, os
          fd = os.open("/dev/kvm", os.O_RDWR)
          assert fcntl.ioctl(fd, 0xAE00) == 12, "KVM_GET_API_VERSION != 12"
          fcntl.ioctl(fd, 0xAE01, 0)
          print("KVM OK as uid", os.getuid())
          PY
      - name: firecracker package tests with KVM present
        run: cd minictd && go test -count=1 -v ./internal/firecracker/...
